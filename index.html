<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mališani Produkcija</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* CIJELA POZADINA STRANICE */
        body {
            background-image: url('pozadina.png');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-color: #000; /* Crna pozadina ako slika zakasni */
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            /* Kraljevsko plava s prozirnošću (zadnji broj 0.85 je stupanj prozirnosti) */
            background-color: rgba(0, 35, 102, 0.85); 
            border: 3px solid #4169E1;
            box-sizing: border-box;
        }
        
        .logo {
            display: block;
            margin: 0 auto 10px auto;
            max-width: 350px;
            height: auto;
        }
        
        .tagline {
            text-align: center;
            color: #87CEFA;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        /* OKVIR PROJEKTA - isto prozirna plava nijansa */
        .project-box {
            background: rgba(26, 60, 142, 0.8);
            border: 1px solid #ffffff;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .hobo-banner {
            display: inline-block;
            max-width: 100%;
            height: auto;
            border: 2px solid #fff;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        
        .hobo-banner:hover {
            transform: scale(1.02);
        }

        .project-desc {
            margin: 0 0 15px 0;
            font-size: 1em;
            color: #e0e0e0;
        }

        a.btn-link {
            display: inline-block;
            background: #4169E1;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #fff;
        }
        a.btn-link:hover {
            background: #ffffff;
            color: #002366;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8em;
            text-align: center;
            border-top: 1px solid #4169E1;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Glavni logo -->
    <img src="logo.png" alt="Mališani Produkcija" class="logo">
    
    <div class="tagline">// Službeno neovlašteni mrežni resurs</div>

    <!-- PROJEKT -->
    <div class="project-box">
        <a href="/hobo-beskucnik/">
            <img src="hobo-logo.png" alt="Hobo Beskućnik Logo" class="hobo-banner">
        </a>
        
        <p class="project-desc">Inovativni stambeno-socijalni projekt koji se ruga sustavu.</p>
        
        <a href="/hobo-beskucnik/" class="btn-link">👉 POGODITE PROJEKT</a>
    </div>

    <div class="footer">
        Mališani Produkcija &copy; 2026. Sva prava zadržana, slobodno ih zanemarite.
    </div>

</body>
</html>
