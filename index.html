<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Mališani Produkcija</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #002366; /* Kraljevsko plava */
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            border: 3px solid #4169E1;
        }
        h1 {
            text-transform: uppercase;
            text-align: center;
        }
        .logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 200px;
        }
        
        /* Stil za okvir projekta */
        .project-box {
            background: #1a3c8e;
            border: 1px solid #ffffff;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center; /* Centriramo sadržaj unutra */
        }
        
        /* Stil za veliku hobo sliku koja je i link */
        .hobo-banner {
            display: inline-block;
            max-width: 100%; /* Da se prilagodi ekranu, a ne prelazi granice */
            height: auto;
            border: 2px solid #fff;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        
        /* Mala animacija kad pređeš mišem preko hobo logoa */
        .hobo-banner:hover {
            transform: scale(1.02);
        }

        .project-desc {
            margin: 0 0 15px 0;
            font-size: 1em;
            color: #e0e0e0;
        }

        a.btn-link {
            display: inline-block;
            background: #4169E1;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #fff;
        }
        a.btn-link:hover {
            background: #ffffff;
            color: #002366;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8em;
            text-align: center;
            border-top: 1px solid #4169E1;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Mališani Logo" class="logo">
    <h1>Mališani Produkcija</h1>
    
    <p style="text-align: center;">// Službeno neovlašteni mrežni resurs</p>

    <!-- PROJEKT UMJESTO TEKSTUALNOG NASLOVA -->
    <div class="project-box">
        <!-- Slika je obavijena linkom tako da klik na nju vodi na hobo stranicu -->
        <a href="/hobo-beskucnik/">
            <img src="hobo-logo.png" alt="Hobo Beskućnik Logo" class="hobo-banner">
        </a>
        
        <p class="project-desc">Inovativni stambeno-socijalni projekt koji se ruga sustavu.</p>
        
        <a href="/hobo-beskucnik/" class="btn-link">👉 POGODITE PROJEKT</a>
    </div>

    <div class="footer">
        Mališani Produkcija &copy; 2026. Sva prava zadržana, slobodno ih zanemarite.
    </div>

</body>
</html>
